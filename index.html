<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="共享动作数据识别表：任何人上传，所有人都能看到和下载。">
  <meta name="theme-color" content="#17211b">
  <title>正在打开共享动作数据识别表</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans SC", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6ef; color: #17211b; }
    main { max-width: 560px; padding: 44px; text-align: center; }
    .mark { width: 52px; height: 52px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 14px; background: #17211b; color: white; font-weight: 800; }
    h1 { margin: 0 0 14px; font-size: clamp(26px, 5vw, 42px); }
    p { color: #657067; line-height: 1.8; }
    a { display: inline-block; margin-top: 18px; padding: 13px 22px; border-radius: 9px; background: #0c633f; color: white; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="mark">M</div>
    <h1>正在打开共享动作数据识别表</h1>
    <p>新版使用 Google 表格和 Google Drive 云端共享；任何人上传后，所有打开链接的人都能看到并下载原文件。</p>
    <a id="continue-link" href="https://script.google.com/macros/s/AKfycbyJ9mmjtsX75i49WfmMQiAKf2dp3JGygqdPbYdZ8kp2O3bUIFIIo1Lf8zL7lH39GEJK/exec">立即进入共享表格</a>
  </main>
  <script>
    const target = document.getElementById('continue-link').href;
    const openSharedTable = () => location.replace(target);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(registrations => Promise.all(registrations.map(registration => registration.unregister())))
        .finally(openSharedTable);
      setTimeout(openSharedTable, 1500);
    } else {
      openSharedTable();
    }
  </script>
</body>
</html>
